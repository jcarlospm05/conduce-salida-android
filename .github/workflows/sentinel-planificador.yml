name: SENTINEL - Planificador y pruebas
on:
  push:
    branches: [codex/sentinel-planificador]
    paths: ['sentinel-planificador/**', '.github/workflows/sentinel-planificador.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sentinel-planificador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar modelo y generar HTML
        run: |
          node --check src/app.js
          node --check src/storage.js
          node tests/model.test.cjs
          python build.py
      - name: Preparar navegador de pruebas
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Probar interacciones del tablero
        run: python tests/browser.py
      - name: Empaquetar entrega
        run: |
          python -c "import zipfile,pathlib; r=pathlib.Path('.'); z=zipfile.ZipFile('SENTINEL-Planificador.zip','w',zipfile.ZIP_DEFLATED); [(z.write(p,p.as_posix())) for p in r.rglob('*') if p.is_file() and p.suffix not in ('.zip','.pyc') and '__pycache__' not in p.parts]; z.close()"
      - uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-Planificador
          path: |
            sentinel-planificador/SENTINEL-Planificador.zip
            sentinel-planificador/SENTINEL-Planificador.html
            sentinel-planificador/RESULTADO_PRUEBAS.json
            sentinel-planificador/vista-tablero.png
            sentinel-planificador/vista-movil.png
      - name: Publicar archivos descargables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sentinel-planificador-v1.0.0 SENTINEL-Planificador.zip SENTINEL-Planificador.html LEER_PRIMERO.txt RESULTADO_PRUEBAS.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "SENTINEL - Planificador del proyecto v1.0.0" --notes "Tablero local de planificación: 56 tareas, seis fases y tres roles. Exportación/importación JSON y contexto TXT. No implementa la aplicación Access ni modifica SharePoint. No publica automáticamente un sitio web." --prerelease

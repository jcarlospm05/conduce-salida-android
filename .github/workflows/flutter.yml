name: Conduce de Salida Flutter APK 3.6.1
on:
  workflow_dispatch:
  push:
    branches: [conduce-flutter-fiel]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Extraer Flutter original sin tocar el reporte
        run: |
          unzip -q CONDUCE_DE_SALIDA_Flutter_fiel_v1.zip
          cp flutter_patch/lib/main.dart CONDUCE_DE_SALIDA_Flutter_fiel_v1/lib/main.dart
      - name: Compilar Android respetando barras del sistema
        run: |
          cd CONDUCE_DE_SALIDA_Flutter_fiel_v1
          flutter create . --platforms android --org com.bobc --project-name conduce_salida_flutter
          mkdir -p android/app/src/main/java/com/bobc/conduce_salida_flutter
          cp android_native/java/com/bobc/conduce_salida_flutter/*.java android/app/src/main/java/com/bobc/conduce_salida_flutter/
          rm -f android/app/src/main/kotlin/com/bobc/conduce_salida_flutter/MainActivity.kt
          cp android_native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r android_native/res/. android/app/src/main/res/
          mkdir -p android/app/src/main/assets/www
          cp -r android_native/www/. android/app/src/main/assets/www/
          rm -f test/widget_test.dart analysis_options.yaml
          flutter pub get
          flutter analyze
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Conduce-de-Salida-Flutter-APK-3.6.1
          path: CONDUCE_DE_SALIDA_Flutter_fiel_v1/build/app/outputs/flutter-apk/app-release.apk
